server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Vue Router history mode: unmatched paths fall back to index.html
  # instead of a raw 404 from nginx.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin API calls in production, mirroring vite.config.js's dev
  # proxy (see frontend/vite.config.js) so app code's relative /api calls
  # don't need a separate base URL. No path on proxy_pass here, so nginx
  # forwards the full original URI unchanged - the backend mounts its own
  # routes under /api/* already (see backend/src/app.js).
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

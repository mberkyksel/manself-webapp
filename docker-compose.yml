services:
  postgres:
    image: postgres:16-alpine
    container_name: manself-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-manself_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-manself_dev}']
      interval: 5s
      timeout: 5s
      retries: 5

  # backend and frontend services will be added here in a later stage,
  # once each has its own Dockerfile.

volumes:
  postgres_data:

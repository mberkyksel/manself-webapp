# One command, no setup:
#
#   docker compose up --build
#
# then open http://localhost:8080 and press "Try the demo".
#
# Nothing needs configuring: demo mode is on, the JWT secret is generated for
# the run, weather uses a keyless provider, and only the web port is published
# (no clashes with a Postgres or dev server you already have running).
# Everything is overridable through a .env file or your shell - see
# .env.example. Needs Docker Compose 2.24 or newer (optional env_file).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-manself_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-manself_dev}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # Optional: a .env file (copied from .env.example) is used if present.
    env_file:
      - path: .env
        required: false
    environment:
      # Point at the compose network's Postgres, whatever a local .env says.
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-manself_dev}
      # Pinned so a dev-oriented .env (NODE_ENV=development) can't switch the
      # container out of production mode.
      NODE_ENV: production
      PORT: 3000
      # On by default so a reviewer can click straight in. Set DEMO_MODE=false
      # (and a real JWT_SECRET) for anything that is not a demo.
      DEMO_MODE: ${DEMO_MODE:-true}
      JWT_SECRET: ${JWT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:

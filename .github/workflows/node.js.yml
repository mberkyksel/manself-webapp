# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code, and run tests across different versions of node
# For more information, see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. BACKEND CI JOB
  backend-ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    # The API tests run against a real Postgres so the migrations (including
    # the ON DELETE CASCADE foreign keys) are exercised, not mocked.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manself_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/manself_test

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }} (Backend)
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'backend/package-lock.json'

    - name: Install Backend Dependencies
      run: npm ci
      working-directory: backend

    - name: Migrate Test Database
      run: npm run test:setup
      working-directory: backend

    - name: Run Backend Tests
      run: npm test
      working-directory: backend

  # 2. FRONTEND CI JOB
  frontend-ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }} (Frontend)
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install Frontend Dependencies
      run: npm ci
      working-directory: frontend

    - name: Build Frontend
      run: npm run build --if-present
      working-directory: frontend

    - name: Run Frontend Tests
      run: npm test --if-present
      working-directory: frontend
